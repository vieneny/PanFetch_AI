[project]
name = "panfetch-ai"
version = "0.1.0"
description = "AI-assisted Baidu Netdisk explorer, downloader, and organizer for Windows"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.15"
authors = [{ name = "PanFetch AI contributors" }]
keywords = ["baidu-netdisk", "desktop", "llm", "pyside6", "download-manager"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "langchain>=1,<2",
    "langgraph>=1,<2",
    "langsmith>=0.4,<1",
    "mcp>=1.22,<2",
    "PySide6>=6.8,<7",
    "pywin32>=312; sys_platform == 'win32'",
    "requests>=2.31,<3",
    "truststore>=0.10,<1",
]

[project.scripts]
panfetch-ai = "panfetch_ai.app:main"
panfetch-ai-cli = "panfetch_ai.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-qt>=4.4,<5",
    "pyinstaller>=6.10,<7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["panfetch_ai"]
